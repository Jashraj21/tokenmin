[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmin"
version = "0.1.0"
description = "High-performance token minimizer and prompt optimizer for AI models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "TokenMin Contributors"}
]
keywords = [
    "llm", "tokens", "token-minimizer", "prompt-compression", "context-window",
    "gpt-4o", "gemini", "claude", "optimization", "rag"
]
dependencies = [
    "tiktoken>=0.7.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tokenmin = "tokenmin.cli.main:main"
tokmin = "tokenmin.cli.main:main"

[tool.setuptools.packages.find]
include = ["tokenmin*"]

